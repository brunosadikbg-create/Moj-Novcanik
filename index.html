<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Moj Novčanik</title>

<style>
:root{
--bg:#f5f7f8;
--card:#fff;
--text:#17202a;
--muted:#7b8794;
--green:#35b779;
--red:#ef6b73;
--line:#e8ecef
}
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:var(--bg);
color:var(--text)
}
.app{
max-width:520px;
margin:auto;
min-height:100vh;
padding-bottom:75px
}
header{
background:#fff;
padding:20px 18px 14px;
border-bottom:1px solid var(--line)
}
.brand{
font-size:28px;
font-weight:800
}
.sub{
color:var(--muted);
font-size:14px
}
.month{
margin-top:14px;
display:flex;
justify-content:space-between;
align-items:center;
background:#f1f4f5;
border-radius:14px;
padding:9px 12px
}
.month button{
border:0;
background:none;
font-size:22px;
padding:4px 12px
}
main{
padding:16px
}
.hero{
background:#fff;
border-radius:24px;
padding:20px;
box-shadow:0 8px 24px #14202a12
}
.balance{
text-align:center
}
.balance small{
color:var(--muted)
}
.balance h1{
font-size:34px;
margin:4px 0
}
.balance p{
color:var(--muted);
margin:0
}
.donut{
width:190px;
height:190px;
border-radius:50%;
margin:20px auto;
display:grid;
place-items:center;
position:relative
}
.donut:after{
content:"";
position:absolute;
width:128px;
height:128px;
background:#fff;
border-radius:50%
}
.donut span{
position:relative;
z-index:1;
font-weight:800;
text-align:center
}
.donut small{
display:block;
color:var(--muted);
font-weight:500
}
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.stat{
background:#f7f9fa;
border-radius:16px;
padding:13px
}
.stat small{
color:var(--muted)
}
.stat b{
display:block;
font-size:18px;
margin-top:4px
}
.income b{
color:var(--green)
}
.expense b{
color:var(--red)
}
.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:16px
}
.actions button{
border:0;
border-radius:15px;
padding:14px;
font-weight:800;
font-size:15px
}
.addIncome{
background:#dff6ea;
color:#198754
}
.addExpense{
background:#ffe3e6;
color:#c94d59
}
h2{
font-size:19px;
margin:24px 2px 12px
}
.cats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}
.cat{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:13px 7px;
text-align:center;
cursor:pointer
}
.cat:active{
transform:scale(.97)
}
.ico{
font-size:27px
}
.cat b{
display:block;
font-size:13px;
margin-top:5px
}
.cat small{
color:var(--muted)
}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid var(--line)
}
nav>div{
max-width:520px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr)
}
nav button{
border:0;
background:none;
padding:10px;
font-size:12px;
color:var(--muted)
}
nav button span{
display:block;
font-size:21px
}
.sheet{
display:none;
position:fixed;
inset:0;
background:#0006;
align-items:flex-end;
z-index:5
}
.sheet.show{
display:flex
}
.modal{
background:#fff;
width:100%;
max-width:520px;
margin:auto;
border-radius:24px 24px 0 0;
padding:20px
}
.close{
float:right;
border:0;
border-radius:50%;
width:34px;
height:34px
}
.modal input,
.modal select{
width:100%;
padding:13px;
border:1px solid #dfe4e7;
border-radius:12px;
font-size:16px;
margin:7px 0 12px
}
