<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moj Novcanik</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
  min-height:100vh;
}

body.dark{
  background:#101418;
  color:#f2f4f5;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:95px;
}

header{
  padding:22px 18px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:26px;
}

.theme-btn{
  border:0;
  background:#e9edf1;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:20px;
  cursor:pointer;
}

.dark .theme-btn{
  background:#252d34;
}

.page{
  padding:10px 16px;
}

.balance-card{
  background:#17202a;
  color:white;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
}

.balance-title{
  font-size:14px;
  opacity:.75;
  margin-bottom:7px;
}

.balance{
  font-size:32px;
  font-weight:bold;
}

.month-box{
  background:white;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.dark .month-box{
  background:#1a2127;
}

.month-arrow{
  border:0;
  background:#edf0f2;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.dark .month-arrow{
  background:#293139;
  color:white;
}

.month-name{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  flex:1;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  border-radius:18px;
  padding:17px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.dark .stat{
  background:#1a2127;
}

.stat-title{
  font-size:13px;
  color:#6b747c;
  margin-bottom:8px;
}

.dark .stat-title{
  color:#aeb7be;
}

.stat-value{
  font-size:20px;
  font-weight:bold;
}

.income{
  color:#16834b;
}

.expense{
  color:#d43c3c;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:20px 0 12px;
}

.savings-card{
  background:#ffffff;
  border-radius:20px;
  padding:19px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  margin-bottom:20px;
}

.dark .savings-card{
  background:#1a2127;
}

.savings-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.savings-name{
  font-weight:bold;
  font-size:17px;
}

.savings-icon{
  font-size:28px;
}

.savings-value{
  font-size:25px;
  font-weight:bold;
  margin-top:10px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.category{
  background:white;
  border-radius:18px;
  padding:17px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.dark .category{
  background:#1a2127;
}

.category-icon{
  font-size:27px;
  margin-bottom:9px;
}

.category-name{
  font-weight:bold;
}

.category-total{
  margin-top:5px;
  color:#d43c3c;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:white;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
}

.dark .bottom-nav{
  background:#171c21;
  border-color:#30373d;
}

.nav-btn{
  border:0;
  background:none;
  font-size:14px;
  padding:8px;
  cursor:pointer;
  color:#59636c;
}

.dark .nav-btn{
  color:#c7ced3;
}

.nav-icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

button{
  font-family:inherit;
}

.primary{
  border:0;
  background:#17202a;
  color:white;
  border-radius:14px;
  padding:14px 18px;
  font-size:16px;
  cursor:pointer;
}

.dark .primary{
  background:#f1f3f4;
  color:#111;
}

.secondary{
  border:1px solid #d5dadd;
  background:white;
  color:#17202a;
  border-radius:14px;
  padding:13px 16px;
  font-size:15px;
  cursor:pointer;
}

.dark .secondary{
  background:#1a2127;
  color:white;
  border-color:#394149;
}

.form-card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
}

.dark .form-card{
  background:#1a2127;
}

label{
  display:block;
  font-size:14px;
  margin-bottom:7px;
  color:#66717a;
}

.dark label{
  color:#b8c0c6;
}

input,
select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #d6dce0;
  background:white;
  color:#17202a;
  font-size:16px;
  margin-bottom:15px;
}

.dark input,
.dark select{
  background:#11171b;
  color:white;
  border-color:#3b444b;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.type-btn{
  padding:13px;
  border-radius:12px;
  border:1px solid #d6dce0;
  background:white;
  cursor:pointer;
}

.dark .type-btn{
  background:#11171b;
  color:white;
  border-color:#3b444b;
}

.type-btn.active-income{
  background:#dff5e8;
  border-color:#35a56b;
  color:#146b3e;
}

.type-btn.active-expense{
  background:#fde4e4;
  border-color:#df5555;
  color:#a52c2c;
}

.back{
  border:0;
  background:none;
  font-size:16px;
  padding:4px 0 16px;
  cursor:pointer;
  color:inherit;
}

.page-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:18px;
}

.history-item{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.dark .history-item{
  background:#1a2127;
}

.history-left{
  min-width:0;
}

.history-desc{
  font-weight:bold;
  margin-bottom:5px;
}

.history-date{
  font-size:12px;
  color:#7a838a;
}

.history-right{
  text-align:right;
  white-space:nowrap;
}

.delete{
  border:0;
  background:#f4dddd;
  color:#a62f2f;
  border-radius:8px;
  padding:6px 8px;
  margin-top:6px;
  cursor:pointer;
  font-size:12px;
}

.saving-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.empty{
  text-align:center;
  padding:30px 15px;
  color:#7b858c;
}

.notice{
  background:#eef3f6;
  border-radius:14px;
  padding:13px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.45;
}

.dark .notice{
  background:#202930;
}

.date-box{
  background:#f5f7f8;
  border-radius:12px;
  padding:10px;
  margin-bottom:5px;
}

.dark .date-box{
  background:#11171b;
}

@media(max-width:380px){
  .categories{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1 id="headerTitle">Moj Novcanik</h1>

  <button
    class="theme-btn"
    onclick="toggleTheme()"
    id="themeBtn"
  >
    🌙
  </button>
</header>

<main id="app"></main>

</div>


<nav class="bottom-nav">

  <button
    class="nav-btn"
    onclick="home()"
  >
    <span class="nav-icon">🏠</span>
    Početna
  </button>


  <button
    class="nav-btn"
    onclick="addPage()"
  >
    <span class="nav-icon">➕</span>
    Unos
  </button>

</nav>


<script>

/* =========================================
   KATEGORIJE
========================================= */

const categories = [
  ["🍔","Hrana"],
  ["🏠","Kuća"],
  ["🚗","Auto"],
  ["❤️","Zdravlje"],
  ["👕","Garderoba"],
  ["⚽","Sport"],
  ["🎁","Pokloni"],
  ["🧾","Sitni računi"],
  ["🍻","Izlasci"],
  ["✈️","Putovanje"]
];


/* =========================================
   POČETNI PODACI

   NOVA VERZIJA:
   Redovan račun = 0
   Uplate = 0
   Troškovi = 0
   Štednja = 10.575
========================================= */

const STORAGE_KEY = "mojNovcanikKalendarV1";

let state =
  JSON.parse(localStorage.getItem(STORAGE_KEY)) || {

    entries: [],

    savings: 10575,

    savingHistory: [

      {
        id: 1,

        type: "initial",

        amount: 10575,

        description: "Početno stanje štednje",

        date: "08.10.2026"

      }

    ],

    initialSavings: 10575

  };


/* =========================================
   AKTIVNI TIP I KATEGORIJA
========================================= */

let currentType = "expense";

let selectedCategory = "";


/* =========================================
   AKTIVNI MESEC

   Trenutno: oktobar 2026
========================================= */

let selectedMonth = "2026-10";


/* =========================================
   ČUVANJE
========================================= */

function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================
   NOVAC
========================================= */

function money(n){

  return Number(n || 0)
    .toLocaleString("sr-RS") + " RSD";

}


/* =========================================
   DATUM
========================================= */

function formatDate(dateString){

  if(!dateString){
    return "";
  }

  const parts = dateString.split("-");

  if(parts.length === 3){

    return (
      parts[2] +
      "." +
      parts[1] +
      "." +
      parts[0] +
      "."
    );

  }

  return dateString;

}


/* =========================================
   DANAS
========================================= */

function todayISO(){

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth() + 1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =========================================
   MESEC + GODINA
========================================= */

function monthName(month){

  const names = [

    "Januar",
    "Februar",
    "Mart",
    "April",
    "Maj",
    "Jun",
    "Jul",
    "Avgust",
    "Septembar",
    "Oktobar",
    "Novembar",
    "Decembar"

  ];

  return names[month - 1];

}


function monthTitle(){

  const parts =
    selectedMonth.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  return (
    monthName(month) +
    " " +
    year
  );

}


/* =========================================
   PROMENA MESECA
========================================= */

function changeMonth(direction){

  const parts =
    selectedMonth.split("-");

  let year =
    Number(parts[0]);

  let month =
    Number(parts[1]);

  month += direction;

  if(month < 1){

    month = 12;
    year--;

  }

  if(month > 12){

    month = 1;
    year++;

  }

  selectedMonth =
    year +
    "-" +
    String(month).padStart(2,"0");

  home();

}


/* =========================================
   DA LI JE U MESECU
========================================= */

function isInSelectedMonth(date){

  return date &&
    date.substring(0,7) === selectedMonth;

}


/* =========================================
   UKUPNI ULAZI / TROŠKOVI ZA MESEC
========================================= */

function monthlyTotals(){

  let income = 0;

  let expense = 0;


  state.entries.forEach(e=>{

    if(!isInSelectedMonth(e.date)){
      return;
    }

    if(e.type === "income"){
      income += Number(e.amount);
    }

    if(e.type === "expense"){
      expense += Number(e.amount);
    }

  });


  return {
    income,
    expense
  };

}


/* =========================================
   SVI UKUPNI PODACI
========================================= */

function allTotals(){

  let income = 0;

  let expense = 0;


  state.entries.forEach(e=>{

    if(e.type === "income"){
      income += Number(e.amount);
    }

    if(e.type === "expense"){
      expense += Number(e.amount);
    }

  });


  return {
    income,
    expense
  };

}


/* =========================================
   IZNOS PREBAČEN U ŠTEDNJU

   NE RAČUNAMO početnih 10.575.
========================================= */

function transferredToSavings(){

  let total = 0;


  state.savingHistory.forEach(x=>{

    if(x.type === "deposit"){

      total += Number(x.amount);

    }

  });


  return total;

}


/* =========================================
   TRENUTNO STANJE REDOVNOG RAČUNA

   Početno = 0

   + sve uplate
   - svi obični troškovi
   - novac prebačen u štednju

   Povlačenje sa štednje NE vraća novac
   na redovan račun.
========================================= */

function regularBalance(){

  const totals =
    allTotals();


  const deposits =
    transferredToSavings();


  return (
    totals.income -
    totals.expense -
    deposits
  );

}


/* =========================================
   UKUPNO PO KATEGORIJI U IZABRANOM MESECU
========================================= */

function categoryTotal(name){

  return state.entries

    .filter(e =>

      e.type === "expense" &&

      e.category === name &&

      isInSelectedMonth(e.date)

    )

    .reduce(

      (sum,e) =>
        sum + Number(e.amount),

      0

    );

}


/* =========================================
   POČETNA STRANA
========================================= */

function home(){

  selectedCategory = "";


  const totals =
    monthlyTotals();


  document.getElementById(
    "headerTitle"
  ).textContent = "Moj Novcanik";


  let html = `

    <div class="page">


      <!-- MESEC -->

      <div class="month-box">

        <button
          class="month-arrow"
          onclick="changeMonth(-1)"
        >
          ‹
        </button>


        <div class="month-name">
          ${monthTitle()}
        </div>


        <button
          class="month-arrow"
          onclick="changeMonth(1)"
        >
          ›
        </button>

      </div>


      <!-- STANJE -->

      <div class="balance-card">

        <div class="balance-title">
          Stanje na redovnom računu
        </div>


        <div class="balance">
          ${money(regularBalance())}
        </div>

      </div>


      <!-- UPLATE / TROŠKOVI -->

      <div class="stats">


        <div
          class="stat"
          onclick="historyPage('income')"
        >

          <div class="stat-title">
            Uplate — ${monthTitle()}
          </div>


          <div class="stat-value income">
            ${money(totals.income)}
          </div>

        </div>


        <div
          class="stat"
          onclick="historyPage('expense')"
        >

          <div class="stat-title">
            Troškovi — ${monthTitle()}
          </div>


          <div class="stat-value expense">
            ${money(totals.expense)}
          </div>

        </div>


      </div>


      <!-- ŠTEDNJA -->

      <div class="section-title">
        Moja štednja
      </div>


      <div
        class="savings-card"
        onclick="savingsPage()"
      >

        <div class="savings-top">


          <div>

            <div class="savings-name">
              🏦 Štedni račun
            </div>


            <div class="savings-value">
              ${money(state.savings)}
            </div>

          </div>


          <div class="savings-icon">
            →
          </div>


        </div>

      </div>


      <!-- KATEGORIJE -->

      <div class="section-title">
        Troškovi po kategorijama — ${monthTitle()}
      </div>


      <div class="categories">

  `;


  categories.forEach(c=>{

    html += `

      <div
        class="category"
        onclick="categoryPage('${c[1]}')"
      >

        <div class="category-icon">
          ${c[0]}
        </div>


        <div class="category-name">
          ${c[1]}
        </div>


        <div class="category-total">
          ${money(categoryTotal(c[1]))}
        </div>

      </div>

    `;

  });


  html += `

      </div>

    </div>

  `;


  document.getElementById(
    "app"
  ).innerHTML = html;

}


/* =========================================
   NOVI UNOS
========================================= */

function addPage(){

  currentType = "expense";


  document.getElementById(
    "headerTitle"
  ).textContent = "Novi unos";


  let html = `

    <div class="page">


      <button
        class="back"
        onclick="goBackFromAdd()"
      >
        ← Nazad
      </button>


      <div class="page-title">
        Novi unos
      </div>


      <div class="form-card">


        <div class="type-buttons">


          <button
            id="incomeBtn"
            class="type-btn"
            onclick="setType('income')"
          >
            💰 Uplata
          </button>


          <button
            id="expenseBtn"
            class="type-btn active-expense"
            onclick="setType('expense')"
          >
            📉 Trošak
          </button>


        </div>


        <label>
          Datum
        </label>


        <div class="date-box">

          <input
            id="entryDate"
            type="date"
            value="${todayISO()}"
          >

        </div>


        <label>
          Iznos
        </label>


        <input
          id="amount"
          type="number"
          inputmode="decimal"
          placeholder="0"
        >


        <label>
          Opis
        </label>


        <input
          id="description"
          type="text"
          placeholder="Npr. plata, račun, gorivo..."
        >


        <div id="categoryBox">

          <label>
            Kategorija
          </label>


          <select id="category">

            ${categories.map(c=>`

              <option
                value="${c[1]}"
                ${
                  selectedCategory === c[1]
                    ? "selected"
                    : ""
                }
              >
                ${c[0]} ${c[1]}
              </option>

            `).join("")}

          </select>

        </div>


        <button
          class="primary"
          onclick="addEntry()"
        >
          Sačuvaj
        </button>


      </div>

    </div>

  `;


  document.getElementById(
    "app"
  ).innerHTML = html;

}


/* =========================================
   POVRATAK IZ UNOSA
========================================= */

function goBackFromAdd(){

  if(selectedCategory){

    categoryPage(
      selectedCategory
    );

  }else{

    home();

  }

}


/* =========================================
   TIP UNOSA
========================================= */

function setType(type){

  currentType = type;


  document.getElementById(
    "incomeBtn"
  ).className =
    "type-btn" +
    (
      type === "income"
        ? " active-income"
        : ""
    );


  document.getElementById(
    "expenseBtn"
  ).className =
    "type-btn" +
    (
      type === "expense"
        ? " active-expense"
        : ""
    );


  document.getElementById(
    "categoryBox"
  ).style.display =
    type === "expense"
      ? "block"
      : "none";

}


/* =========================================
   ČUVANJE NOVOG UNOSA
========================================= */

function addEntry(){

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const date =
    document.getElementById(
      "entryDate"
    ).value;


  if(!date){

    alert("Izaberi datum.");

    return;

  }


  if(!amount || amount <= 0){

    alert("Unesi iznos.");

    return;

  }


  if(!description){

    alert("Unesi opis.");

    return;

  }


  let category = "";


  if(currentType === "expense"){

    category =
      document.getElementById(
        "category"
      ).value;

  }


  state.entries.push({

    id: Date.now(),

    type: currentType,

    amount: amount,

    description: description,

    category: category,

    date: date,

    fromSavings: false

  });


  saveState();


  /*
    Posle čuvanja više nismo
    zaključani na prethodnu kategoriju.
  */

  selectedCategory = "";


  /*
    Prebacujemo prikaz na mesec
    u kome je unos napravljen.
  */

  selectedMonth =
    date.substring(0,7);


  home();

}


/* =========================================
   STRANICA KATEGORIJE
========================================= */

function categoryPage(name){

  /*
    OVO JE VAŽNO:

    Kada uđeš u Kuća,
    selectedCategory = Kuća.

    Kada zatim klikneš Unos,
    kategorija će automatski biti Kuća.
  */

  selectedCategory = name;


  const list =
    state.entries.filter(e =>

      e.type === "expense" &&

      e.category === name &&

      isInSelectedMonth(e.date)

    );


  document.getElementById(
    "headerTitle"
  ).textContent = name;


  let html = `

    <div class="page">


      <button
        class="back"
        onclick="home()"
      >
        ← Nazad
      </button>


      <div class="page-title">
        ${name}
      </div>


      <div class="section-title">
        Ukupno: ${money(categoryTotal(name))}
      </div>

  `;


  if(!list.length){

    html += `

      <div class="empty">
        Nema unosa u ${monthTitle()}.
      </div>

    `;

  }else{

    [...list]
      .reverse()
      .forEach(e=>{

        html += historyItem(e);

      });

  }


  html += `

    </div>

  `;


  document.getElementById(
    "app"
  ).innerHTML = html;

}


/* =========================================
   ISTORIJA UPLATA / TROŠKOVA
========================================= */

function historyPage(type){

  selectedCategory = "";


  const list =
    state.entries.filter(e =>

      e.type === type &&

      isInSelectedMonth(e.date)

    );


  document.getElementById(
    "headerTitle"
  ).textContent =
    type === "income"
      ? "Uplate"
      : "Troškovi";


  let html = `

    <div class="page">


      <button
        class="back"
        onclick="home()"
      >
        ← Nazad
      </button>


      <div class="page-title">

        ${
          type === "income"
            ? "Istorija uplata"
            : "Istorija troškova"
        }

      </div>


      <div class="section-title">
        ${monthTitle()}
      </div>

  `;


  if(!list.length){

    html += `

      <div class="empty">
        Nema unosa za ${monthTitle()}.
      </div>

    `;

  }else{

    [...list]
      .reverse()
      .forEach(e=>{

        html += historyItem(e);

      });

  }


  html += `</div>`;


  document.getElementById(
    "app"
  ).innerHTML = html;

}


/* =========================================
   STAVKA ISTORIJE
========================================= */

function historyItem(e){

  return `

    <div class="history-item">


      <div class="history-left">


        <div class="history-desc">
          ${escapeHtml(e.description)}
        </div>


        <div class="history-date">

          ${formatDate(e.date)}

          ${
            e.category
              ? " • " + e.category
              : ""
          }

        </div>


      </div>


      <div class="history-right">


        <div class="${
          e.type === "income"
            ? "income"
            : "expense"
        }">

          ${
            e.type === "income"
              ? "+"
              : "-"
          }

          ${money(e.amount)}

        </div>


        <button
          class="delete"
          onclick="deleteEntry(${e.id})"
        >
          Obriši
        </button>


      </div>


    </div>

  `;

}


/* =========================================
   BRISANJE UNOSA
========================================= */

function deleteEntry(id){

  const e =
    state.entries.find(
      x => x.id === id
    );


  if(!e){
    return;
  }


  if(
    !confirm(
      "Obrisati ovaj unos?"
    )
  ){
    return;
  }


  state.entries =
    state.entries.filter(
      x => x.id !== id
    );


  saveState();


  if(e.type === "income"){

    historyPage("income");

  }else{

    historyPage("expense");

  }

}

        </button>

/* =========================================
   ČUVANJE UPLATE U ŠTEDNJU
========================================= */

function saveSavingDeposit(){

  const amount =
    Number(
      document.getElementById(
        "savingAmount"
      ).value
    );


  const description =
    document.getElementById(
      "savingDescription"
    ).value.trim();


  const date =
    document.getElementById(
      "savingDate"
    ).value;


  if(!date){

    alert("Izaberi datum.");

    return;

  }


  if(!amount || amount <= 0){

    alert("Unesi iznos.");

    return;

  }


  if(amount > regularBalance()){

    alert(
      "Nema dovoljno novca na redovnom računu."
    );

    return;

  }


  if(!description){

    alert("Unesi opis.");

    return;

  }


  /*
    Uplata na štednju:

    redovan račun - iznos

    štednja + iznos

    nije prihod
    nije trošak
  */

  state.savings += amount;


  state.savingHistory.push({

    id: Date.now(),

    type: "deposit",

    amount: amount,

    description: description,

    date: date

  });


  saveState();


  savingsPage();

}

/* =========================================
   ČUVANJE POVLAČENJA SA ŠTEDNJE
========================================= */

function saveSavingWithdraw(){

  const amount =
    Number(
      document.getElementById(
        "savingAmount"
      ).value
    );


  const description =
    document.getElementById(
      "savingDescription"
    ).value.trim();


  const date =
    document.getElementById(
      "savingDate"
    ).value;


  const category =
    document.getElementById(
      "savingCategory"
    ).value;


  if(!date){

    alert("Izaberi datum.");

    return;

  }


  if(!amount || amount <= 0){

    alert("Unesi iznos.");

    return;

  }


  if(amount > state.savings){

    alert(
      "Nema dovoljno novca na štednom računu."
    );

    return;

  }


  if(!description){

    alert("Unesi opis.");

    return;

  }


  /*
    ŠTEDNJA - iznos

    TROŠKOVI + iznos

    REDOVAN RAČUN NE MENJAMO.

    Zato što je novac već bio skinut
    sa redovnog računa kada je prebačen
    na štednju.
  */

  state.savings -= amount;


  state.entries.push({

    id: Date.now(),

    type: "expense",

    amount: amount,

    description: description,

    category: category,

    date: date,

    fromSavings: true

  });


  state.savingHistory.push({

    id: Date.now() + 1,

    type: "withdraw",

    amount: amount,

    description: description,

    date: date,

    category: category

  });


  saveState();


  selectedMonth =
    date.substring(0,7);


  savingsPage();

}


/* =========================================
   TAMNA / SVETLA TEMA
========================================= */

function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );


  const dark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "mojNovcanikTheme",
    dark
      ? "dark"
      : "light"
  );


  document.getElementById(
    "themeBtn"
  ).textContent =
    dark
      ? "☀️"
      : "🌙";

}


function loadTheme(){

  const theme =
    localStorage.getItem(
      "mojNovcanikTheme"
    );


  if(theme === "dark"){

    document.body.classList.add(
      "dark"
    );


    document.getElementById(
      "themeBtn"
    ).textContent = "☀️";

  }

}


/* =========================================
   ZAŠTITA TEKSTA
========================================= */

function escapeHtml(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadTheme();

home();
