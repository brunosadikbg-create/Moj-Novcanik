<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17202a">
<title>Moj Novcanik</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;min-height:100vh}
body.dark{background:#101418;color:#f2f4f5}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px}
.theme-btn,.month-arrow{border:0;background:#e9edf1;border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
.theme-btn{border-radius:50%}
.page{padding:10px 16px}
.balance-card{background:#17202a;color:white;border-radius:22px;padding:22px;margin-bottom:16px}
.balance-title{font-size:14px;opacity:.75;margin-bottom:7px}
.balance{font-size:32px;font-weight:bold;overflow-wrap:anywhere}
.month-box{background:white;border-radius:18px;padding:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 8px #0000000d}
.month-name{text-align:center;font-size:18px;font-weight:bold;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat,.savings-card,.category,.form-card,.history-item{background:white;border-radius:18px;padding:17px;box-shadow:0 2px 8px #0000000d}
.stat,.category,.savings-card{cursor:pointer}
.stat-title{font-size:13px;color:#6b747c;margin-bottom:8px}
.stat-value{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
.income{color:#16834b}
.expense,.category-total{color:#d43c3c}
.section-title{font-size:19px;font-weight:bold;margin:20px 0 12px}
.savings-card{margin-bottom:20px}
.savings-top{display:flex;justify-content:space-between;align-items:center}
.savings-name{font-weight:bold;font-size:17px}
.savings-value{font-size:25px;font-weight:bold;margin-top:10px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.category-icon{font-size:27px;margin-bottom:9px}
.category-name{font-weight:bold}
.category-total{margin-top:5px;font-weight:bold}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:20}
.nav-btn{border:0;background:none;font-size:14px;padding:8px;cursor:pointer;color:#59636c}
.nav-icon{display:block;font-size:23px;margin-bottom:3px}
