HTML

<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17202a">
<title>Moj Novcanik</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;min-height:100vh}
body.dark{background:#101418;color:#f2f4f5}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px}
.theme-btn,.month-arrow{border:0;background:#e9edf1;border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
.theme-btn{border-radius:50%}
.page{padding:10px 16px}
.balance-card{background:#17202a;color:white;border-radius:22px;padding:22px;margin-bottom:16px}
.balance-title{font-size:14px;opacity:.75;margin-bottom:7px}
.balance{font-size:32px;font-weight:bold;overflow-wrap:anywhere}
.month-box{background:white;border-radius:18px;padding:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 8px #0000000d}
.month-name{text-align:center;font-size:18px;font-weight:bold;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat,.savings-card,.category,.form-card,.history-item{background:white;border-radius:18px;padding:17px;box-shadow:0 2px 8px #0000000d}
.stat,.category,.savings-card{cursor:pointer}
.stat-title{font-size:13px;color:#6b747c;margin-bottom:8px}
.stat-value{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
.income{color:#16834b}
.expense,.category-total{color:#d43c3c}
.section-title{font-size:19px;font-weight:bold;margin:20px 0 12px}
.savings-card{margin-bottom:20px}
.savings-top{display:flex;justify-content:space-between;align-items:center}
.savings-name{font-weight:bold;font-size:17px}
.savings-value{font-size:25px;font-weight:bold;margin-top:10px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.category-icon{font-size:27px;margin-bottom:9px}
.category-name{font-weight:bold}
.category-total{margin-top:5px;font-weight:bold}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:20}
.nav-btn{border:0;background:none;font-size:14px;padding:8px;cursor:pointer;color:#59636c}
.nav-icon{display:block;font-size:23px;margin-bottom:3px}
button{font-family:inherit}
.primary,.secondary{border-radius:14px;padding:13px 16px;font-size:15px;cursor:pointer}
.primary{border:0;background:#17202a;color:white}
.secondary{border:1px solid #d5dadd;background:white;color:#17202a}
.form-card{margin-bottom:15px}
label{display:block;font-size:14px;margin-bottom:7px;color:#66717a}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #d6dce0;background:white;color:#17202a;font-size:16px;margin-bottom:15px}
.type-buttons,.saving-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.type-btn{padding:13px;border-radius:12px;border:1px solid #d6dce0;background:white;cursor:pointer}
.active-income{background:#dff5e8!important;color:#146b3e}
.active-expense{background:#fde4e4!important;color:#a52c2c}
.back{border:0;background:none;font-size:16px;padding:4px 0 16px;cursor:pointer;color:inherit}
.page-title{font-size:25px;font-weight:bold;margin-bottom:18px}
.history-item{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.history-left{min-width:0}
.history-desc{font-weight:bold;margin-bottom:5px;overflow-wrap:anywhere}
.history-date{font-size:12px;color:#7a838a}
.history-right{text-align:right;white-space:nowrap}
.delete{border:0;background:#f4dddd;color:#a62f2f;border-radius:8px;padding:6px 8px;margin-top:6px;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:30px 15px;color:#7b858c}
.notice{background:#eef3f6;border-radius:14px;padding:13px;margin-bottom:15px;font-size:13px;line-height:1.45}
.dark .month-box,.dark .stat,.dark .savings-card,.dark .category,.dark .form-card,.dark .history-item,.dark .bottom-nav{background:#1a2127}
.dark .month-arrow,.dark .theme-btn{background:#293139;color:white}
.dark .stat-title,.dark label{color:#aeb7be}
.dark .bottom-nav{border-color:#30373d}
.dark .nav-btn{color:#c7ced3}
.dark input,.dark select,.dark .type-btn,.dark .secondary{background:#11171b;color:white;border-color:#3b444b}
.dark .primary{background:#f1f3f4;color:#111}
.dark .notice{background:#202930}
@media(max-width:380px){.categories{grid-template-columns:1fr}.stat-value{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1 id="headerTitle">Moj Novcanik</h1>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</header>
<main id="app"></main>
</div>
<nav class="bottom-nav">
<button class="nav-btn" onclick="home()"><span class="nav-icon">🏠</span>Početna</button>
<button class="nav-btn" onclick="addPage()"><span class="nav-icon">➕</span>Unos</button>
</nav>

<script>
const categories=[
["🍔","Hrana"],["🏠","Kuća"],["🚗","Auto"],["❤️","Zdravlje"],
["👕","Garderoba"],["⚽","Sport"],["🎁","Pokloni"],
["🧾","Sitni računi"],["🍻","Izlasci"],["✈️","Putovanje"]
];

const STORAGE_KEY="mojNovcanikKalendarV1";
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){}
if(!state||typeof state!=="object"){
state={
 entries:[],
 savings:9000,
 savingHistory:[{id:1,type:"initial",amount:9000,description:"Početno stanje štednje",date:"2026-10-08"}],
 initialSavings:9000
};
}
if(!Array.isArray(state.entries))state.entries=[];
if(!Array.isArray(state.savingHistory))state.savingHistory=[];
if(!Number.isFinite(Number(state.savings)))state.savings=9000;
if(state.regularBalanceCorrection===undefined)state.regularBalanceCorrection=state.entries.length?5400:0;

let currentType="expense",selectedCategory="",selectedMonth="2026-10";

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function money(n){return Number(n||0).toLocaleString("sr-RS")+" RSD"}
function esc(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function todayISO(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function formatDate(s){if(/^\d{4}-\d{2}-\d{2}$/.test(s||"")){let p=s.split("-");return `${p[2]}.${p[1]}.${p[0]}.`}return s||""}
function monthName(m){return ["Januar","Februar","Mart","April","Maj","Jun","Jul","Avgust","Septembar","Oktobar","Novembar","Decembar"][m-1]}
function monthTitle(){let p=selectedMonth.split("-");return monthName(+p[1])+" "+p[0]}
function changeMonth(n){let p=selectedMonth.split("-"),d=new Date(+p[0],+p[1]-1+n,1);selectedMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");home()}
function isMonth(d){return !!d&&String(d).slice(0,7)===selectedMonth}
function monthlyTotals(){
 let income=0,expense=0;
 state.entries.forEach(e=>{if(!isMonth(e.date))return;if(e.type==="income")income+=+e.amount||0;if(e.type==="expense")expense+=+e.amount||0});
 return{income,expense}
}
function allTotals(){
 let income=0,regularExpense=0;
 state.entries.forEach(e=>{if(e.type==="income")income+=+e.amount||0;if(e.type==="expense"&&!e.fromSavings)regularExpense+=+e.amount||0});
 return{income,regularExpense}
}
function savingDeposits(){return state.savingHistory.filter(x=>x.type==="deposit").reduce((s,x)=>s+(+x.amount||0),0)}
function savingWithdrawals(){return state.savingHistory.filter(x=>x.type==="withdraw").reduce((s,x)=>s+(+x.amount||0),0)}
function regularBalance(){let t=allTotals();return t.income-t.regularExpense-savingDeposits()+savingWithdrawals()+Number(state.regularBalanceCorrection||0)}
function categoryTotal(n){return state.entries.filter(e=>e.type==="expense"&&e.category===n&&isMonth(e.date)).reduce((s,e)=>s+(+e.amount||0),0)}

function home(){
 selectedCategory="";
 let t=monthlyTotals();
 document.getElementById("headerTitle").textContent="Moj Novcanik";
 let h=`<div class="page">
 <div class="month-box">
 <button class="month-arrow" onclick="changeMonth(-1)">‹</button>
 <div class="month-name">${monthTitle()}</div>
 <button class="month-arrow" onclick="changeMonth(1)">›</button>
 </div>
 <div class="balance-card"><div class="balance-title">Stanje na redovnom računu</div><div class="balance">${money(regularBalance())}</div></div>
 <div class="stats">
 <div class="stat" onclick="historyPage('income')"><div class="stat-title">Uplate — ${monthTitle()}</div><div class="stat-value income">${money(t.income)}</div></div>
 <div class="stat" onclick="historyPage('expense')"><div class="stat-title">Troškovi — ${monthTitle()}</div><div class="stat-value expense">${money(t.expense)}</div></div>
 </div>
 <div class="section-title">Moja štednja</div>
 <div class="savings-card" onclick="savingsPage()"><div class="savings-top"><div><div class="savings-name">🏦 Štedni račun</div><div class="savings-value">${money(state.savings)}</div></div><div style="font-size:28px">→</div></div></div>
 <div class="section-title">Troškovi po kategorijama — ${monthTitle()}</div><div class="categories">`;
 categories.forEach(c=>h+=`<div class="category" onclick="categoryPage('${c[1]}')"><div class="category-icon">${c[0]}</div><div class="category-name">${c[1]}</div><div class="category-total">${money(categoryTotal(c[1]))}</div></div>`);
 document.getElementById("app").innerHTML=h+"</div></div>";
}

function addPage(){
 currentType="expense";
 document.getElementById("headerTitle").textContent="Novi unos";
 document.getElementById("app").innerHTML=`<div class="page">
 <button class="back" onclick="goBackFromAdd()">← Nazad</button>
 <div class="page-title">Novi unos</div>
 <div class="form-card">
 <div class="type-buttons">
 <button id="incomeBtn" class="type-btn" onclick="setType('income')">💰 Uplata</button>
 <button id="expenseBtn" class="type-btn active-expense" onclick="setType('expense')">📉 Trošak</button>
 </div>
 <label>Datum</label><input id="entryDate" type="date" value="${todayISO()}">
 <label>Iznos (RSD)</label><input id="amount" type="number" min="1" step="1" placeholder="0">
 <label>Opis</label><input id="description" placeholder="Npr. plata, račun, gorivo...">
 <div id="categoryBox"><label>Kategorija</label><select id="category">${categories.map(c=>`<option value="${c[1]}" ${selectedCategory===c[1]?"selected":""}>${c[0]} ${c[1]}</option>`).join("")}</select></div>
 <button class="primary" onclick="addEntry()">Sačuvaj</button>
 </div></div>`;
}
function goBackFromAdd(){selectedCategory?categoryPage(selectedCategory):home()}
function setType(t){
 currentType=t;
 document.getElementById("incomeBtn").className="type-btn"+(t==="income"?" active-income":"");
 document.getElementById("expenseBtn").className="type-btn"+(t==="expense"?" active-expense":"");
 document.getElementById("categoryBox").style.display=t==="expense"?"block":"none";
}
function addEntry(){
 let amount=Number(document.getElementById("amount").value),description=document.getElementById("description").value.trim(),date=document.getElementById("entryDate").value;
 if(!date)return alert("Izaberi datum.");
 if(!Number.isFinite(amount)||amount<=0)return alert("Unesi iznos veći od nule.");
 if(!description)return alert("Unesi opis.");
 let category=currentType==="expense"?document.getElementById("category").value:"";
 state.entries.push({id:Date.now(),type:currentType,amount,description,category,date,fromSavings:false});
 saveState();selectedCategory="";selectedMonth=date.slice(0,7);home();
}

function categoryPage(n){
 selectedCategory=n;
 let list=state.entries.filter(e=>e.type==="expense"&&e.category===n&&isMonth(e.date));
 document.getElementById("headerTitle").textContent=n;
 let h=`<div class="page"><button class="back" onclick="home()">← Nazad</button><div class="page-title">${n}</div><div class="section-title">Ukupno: ${money(categoryTotal(n))}</div>`;
 if(!list.length)h+=`<div class="empty">Nema unosa u ${monthTitle()}.</div>`;
 else [...list].reverse().forEach(e=>h+=historyItem(e));
 document.getElementById("app").innerHTML=h+"</div>";
}
function historyPage(type){
 selectedCategory="";
 let list=state.entries.filter(e=>e.type===type&&isMonth(e.date));
 document.getElementById("headerTitle").textContent=type==="income"?"Uplate":"Troškovi";
 let h=`<div class="page"><button class="back" onclick="home()">← Nazad</button><div class="page-title">${type==="income"?"Istorija uplata":"Istorija troškova"}</div><div class="section-title">${monthTitle()}</div>`;
 if(!list.length)h+=`<div class="empty">Nema unosa za ${monthTitle()}.</div>`;
 else [...list].reverse().forEach(e=>h+=historyItem(e));
 document.getElementById("app").innerHTML=h+"</div>";
}
function historyItem(e){
 return `<div class="history-item"><div class="history-left"><div class="history-desc">${esc(e.description)}</div><div class="history-date">${formatDate(e.date)}${e.category?" • "+esc(e.category):""}${e.fromSavings?" • Plaćeno sa štednje":""}</div></div><div class="history-right"><div class="${e.type==="income"?"income":"expense"}">${e.type==="income"?"+":"−"} ${money(e.amount)}</div><button class="delete" onclick="deleteEntry(${Number(e.id)})">Obriši</button></div></div>`;
}
function deleteEntry(id){
 let e=state.entries.find(x=>Number(x.id)===Number(id));
 if(!e||!confirm("Obrisati ovaj unos?"))return;
 state.entries=state.entries.filter(x=>Number(x.id)!==Number(id));
 saveState();historyPage(e.type);
}

function savingsPage(){
 selectedCategory="";
 document.getElementById("headerTitle").textContent="Štedni račun";
 let h=`<div class="page">
 <button class="back" onclick="home()">← Nazad</button>
 <div class="page-title">🏦 Štedni račun</div>
 <div class="balance-card"><div class="balance-title">Trenutno stanje štednje</div><div class="balance">${money(state.savings)}</div></div>
 <div class="saving-buttons">
 <button class="primary" onclick="savingDepositPage()">+ Uplati sa redovnog</button>
 <button class="secondary" onclick="savingDirectDepositPage()">+ Uplata na štedni račun</button>
 </div>
 <div class="section-title">Istorija štednje</div>`;
 if(!state.savingHistory.length)h+=`<div class="empty">Nema aktivnosti na štednom računu.</div>`;
 else [...state.savingHistory].reverse().forEach(x=>{
  const positive=x.type==="deposit"||x.type==="directDeposit";
  h+=`<div class="history-item"><div class="history-left"><div class="history-desc">${esc(x.description)}</div><div class="history-date">${formatDate(x.date)}</div></div><div class="history-right">${x.type==="initial"?money(x.amount):`<div class="${positive?"income":"expense"}">${positive?"+":"−"} ${money(x.amount)}</div>`}</div></div>`;
 });
 document.getElementById("app").innerHTML=h+"</div>";
}

function savingDepositPage(){
 document.getElementById("headerTitle").textContent="Uplata na štednju";
 document.getElementById("app").innerHTML=`<div class="page">
 <button class="back" onclick="savingsPage()">← Nazad</button>
 <div class="page-title">Uplata sa redovnog рачуна</div>
 <div class="notice">Novac se prebacuje sa redovnog na štedni račun. Nije novi prihod niti trošak.</div>
 <div class="form-card">
 <label>Datum</label><input id="savingDate" type="date" value="${todayISO()}">
 <label>Iznos (RSD)</label><input id="savingAmount" type="number" min="1" step="1" placeholder="Npr. 5000">
 <label>Opis</label><input id="savingDescription" placeholder="Npr. mesečna štednja">
 <button class="primary" onclick="saveSavingDeposit()">Uplati sa redovnog</button>
 </div></div>`;
}
function saveSavingDeposit(){
 let amount=Number(document.getElementById("savingAmount").value),description=document.getElementById("savingDescription").value.trim(),date=document.getElementById("savingDate").value;
 if(!date)return alert("Izaberi datum.");
 if(!Number.isFinite(amount)||amount<=0)return alert("Unesi iznos veći od nule.");
 if(amount>regularBalance())return alert("Nema dovoljno novca na redovnom računu.");
 if(!description)return alert("Unesi opis.");
 state.savings+=amount;
 state.savingHistory.push({id:Date.now(),type:"deposit",amount,description,date});
 saveState();savingsPage();
}

function savingDirectDepositPage(){
 document.getElementById("headerTitle").textContent="Uplata na štedni račun";
 document.getElementById("app").innerHTML=`<div class="page">
 <button class="back" onclick="savingsPage()">← Nazad</button>
 <div class="page-title">Uplata na štedni račun</div>
 <div class="notice">Ova uplata dodaje novac direktno na štedni račun i ne skida ga sa redovnog računa.</div>
 <div class="form-card">
 <label>Datum</label><input id="savingDate" type="date" value="${todayISO()}">
 <label>Iznos (RSD)</label><input id="savingAmount" type="number" min="1" step="1" placeholder="Npr. 5000">
 <label>Opis</label><input id="savingDescription" placeholder="Npr. direktna uplata na štednju">
 <button class="primary" onclick="saveSavingDirectDeposit()">Uplati na štedni račun</button>
 </div></div>`;
}
function saveSavingDirectDeposit(){
 let amount=Number(document.getElementById("savingAmount").value),description=document.getElementById("savingDescription").value.trim(),date=document.getElementById("savingDate").value;
 if(!date)return alert("Izaberi datum.");
 if(!Number.isFinite(amount)||amount<=0)return alert("Unesi iznos veći od nule.");
 if(!description)return alert("Unesi opis.");
 state.savings+=amount;
 state.savingHistory.push({id:Date.now(),type:"directDeposit",amount,description,date});
 saveState();selectedMonth=date.slice(0,7);savingsPage();
}

function toggleTheme(){
 document.body.classList.toggle("dark");
 let d=document.body.classList.contains("dark");
 localStorage.setItem("mojNovcanikTheme",d?"dark":"light");
 document.getElementById("themeBtn").textContent=d?"☀️":"🌙";
}
function loadTheme(){
 if(localStorage.getItem("mojNovcanikTheme")==="dark"){
  document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent="☀️";
 }
}
loadTheme();
home();
</script>
</body>
</html>
